version: 2
updates:
  - package-ecosystem: maven
    directory: /modern
    schedule:
      interval: weekly
    groups:
      maven-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /modern-ui
    schedule:
      interval: weekly
    groups:
      npm-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directories: [/modern, /modern-ui]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
