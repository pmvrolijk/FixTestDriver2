spring:
  application:
    name: fixtestdriver
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/fixtestdriver;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      # Flyway owns the schema now; Hibernate only validates that entities match it.
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    # The pre-existing file DB has no schema-history table; baseline it at V1 so the
    # already-present tables are adopted rather than re-created, then apply V2+ on top.
    baseline-on-migrate: true
    baseline-version: 1
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

application:
  fix:
    config-path: ${FIX_CONFIG_PATH:src/main/resources/config/FixEngine.cfg}
  testcases:
    root: ${TESTCASES_ROOT:src/main/resources/config/testcases}
  dictionary:
    filename: ${PRODUCTS_DEF_PATH:src/main/resources/config/products.def}
  quickfix:
    dictionary-path: ${QUICKFIX_DICT_PATH:src/main/resources/config/quickfix}

logging:
  level:
    nl.lamia.fixtestdriver: INFO
    org.quickfixj: INFO
  file:
    name: ${LOG_PATH:./logs}/fixtestdriver.log
