//log4j Configuration File 
#set the level of the root logger to DEBUG and set its appender as an appender named X
log4j.rootLogger = DEBUG, logfile

log4j.logger.nl.lamia.FixTools.FixEngine = INFO, msgLog

#Class overrides
log4j.logger.nl.lamia.FixTools.QueuedMessage = INFO

#set the appender named X to be a console appender
log4j.appender.console=org.apache.log4j.ConsoleAppender

#set the layout for the appender X
log4j.appender.console.layout=org.apache.log4j.PatternLayout
log4j.appender.console.layout.conversionPattern=%d [%t] %-5p %c{2} %x - %m%n

#Logging to file
log4j.appender.logfile=org.apache.log4j.RollingFileAppender
log4j.appender.logfile.File=logs/testrun.log
log4j.appender.logfile.append=false

log4j.appender.logfile.MaxFileSize=1024KB
# Keep one backup file
log4j.appender.logfile.MaxBackupIndex=1

log4j.appender.logfile.layout=org.apache.log4j.PatternLayout
log4j.appender.logfile.layout.conversionPattern=%d [%t] %-5p %c{2} %x - %m%n

#Logging Fixmessages to separate file
log4j.appender.msgLog=org.apache.log4j.FileAppender
log4j.appender.msgLog.File=logs/Fixmessages.log
log4j.appender.msgLog.append=false
log4j.appender.msgLog.layout=org.apache.log4j.PatternLayout
log4j.appender.msgLog.layout.conversionPattern=%m%n
